name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_links.py
      - run: python3 scripts/check_originals.py
      - run: python3 -m unittest discover -s cases/evaluator-loop -p 'test_*.py'
      - run: python3 -m unittest discover -s labs/prompt-contract -p 'test_*.py'
      - run: python3 labs/prompt-contract/grade.py
      - run: python3 -m unittest discover -s labs/prompt-comparison -p 'test_*.py'
      - run: python3 labs/prompt-comparison/check_saved.py
      - run: python3 -m unittest discover -s labs/model-mechanics -p 'test_*.py'
      - run: python3 labs/model-mechanics/check_recording.py
      - run: python3 -m unittest discover -s labs/representations -p 'test_*.py'
      - run: python3 labs/representations/check_saved.py
      - run: python3 -m unittest discover -s labs/retrieval -p 'test_*.py'
      - run: python3 labs/retrieval/check_saved.py
      - run: python3 -m unittest discover -s labs/output-repair -p 'test_*.py'
      - run: python3 labs/output-repair/check_saved.py
      - run: python3 labs/natural-notes/check_saved.py
      - run: python3 -m unittest discover -s labs/natural-notes/review -p 'test_*.py'
      - run: python3 -m unittest discover -s labs/evidence-grounding -p 'test_*.py'
      - run: python3 labs/evidence-grounding/check_saved.py
      - run: python3 -m unittest discover -s labs/bounded-agent -p 'test_*.py'
      - run: python3 labs/bounded-agent/check_saved.py
      - run: python3 -m unittest discover -s labs/agent-recovery -p 'test_*.py'
      - run: python3 labs/agent-recovery/check_saved.py
      - run: python3 -m unittest discover -s scripts -p 'test_source_watch.py'
      - run: python3 evaluation/check.py --output /tmp/evaluation.json
      - name: Verify the saved search implementation
        run: |
          trial_dir=$(mktemp -d)
          cp labs/search-fix/after.py "$trial_dir/search.py"
          cp labs/search-fix/test_search.py "$trial_dir/test_search.py"
          cd "$trial_dir"
          python3 -m unittest -v

  mcp-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r examples/mcp-notes/requirements.txt
      - run: python3 examples/mcp-notes/client.py
