name: Upstream source watch
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare upstream revisions with inspected sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/source_watch.py --output source-watch-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-watch-report
          path: source-watch-report/
          retention-days: 30
          if-no-files-found: error
