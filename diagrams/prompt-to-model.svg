<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
<title id="title">What a prompt changes</title><desc id="desc">Instructions and evidence become input tokens. A model uses learned parameters to generate output tokens. The application decodes and checks the answer. During ordinary inference the prompt changes input, not the learned parameters. This is a conceptual illustration, not a measured attention map.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#506574" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="560" rx="16" fill="#f5f2eb"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172c39">
<text x="35" y="48" font-size="27" font-weight="bold">What a prompt changes</text>
<text x="35" y="78" font-size="16">Conceptual autoregressive text model • not a view of a proprietary model's internal state</text>
<g fill="#fff" stroke="#b8c5cb" stroke-width="1.5">
<rect x="35" y="120" width="255" height="155" rx="12"/><rect x="355" y="120" width="255" height="155" rx="12"/><rect x="675" y="120" width="290" height="155" rx="12"/>
<rect x="355" y="330" width="255" height="120" rx="12"/><rect x="675" y="330" width="290" height="120" rx="12"/>
</g>
<g font-size="20" font-weight="bold"><text x="55" y="155">1. Assemble input</text><text x="375" y="155">2. Represent as tokens</text><text x="695" y="155">3. Generate next token</text><text x="375" y="365">Learned parameters</text><text x="695" y="365">4. Decode and check</text></g>
<g font-size="17">
<text x="55" y="192">Task + decision rules</text><text x="55" y="220">+ examples + evidence</text><text x="55" y="248">This is what you can change.</text>
<text x="375" y="192">Text → token IDs</text><text x="375" y="220">→ numerical representations</text><text x="375" y="248">Splits depend on tokenizer.</text>
<text x="695" y="192">Use context and parameters.</text><text x="695" y="220">Select from a distribution.</text><text x="695" y="248">Repeat until stopping.</text>
<text x="375" y="398">Set through training.</text><text x="375" y="426">Not rewritten by this prompt.</text>
<text x="695" y="398">Output tokens → answer</text><text x="695" y="426">Compare with evidence/tests.</text>
</g>
<g fill="none" stroke="#506574" stroke-width="2" marker-end="url(#arrow)"><path d="M290 197H347"/><path d="M610 197H667"/><path d="M820 275V322"/><path d="M610 390H640V260H667"/></g>
<text x="35" y="505" font-size="18" font-weight="bold">Clearer input can reduce ambiguity. It does not guarantee a correct answer.</text>
<text x="35" y="535" font-size="16">To establish an improvement, compare actual outputs under defined conditions and retain the failures.</text>
</g></svg>
