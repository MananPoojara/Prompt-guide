<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="290" viewBox="0 0 1100 290" role="img" aria-labelledby="title desc">
<title id="title">The prompting learning loop</title><desc id="desc">Define an outcome, select relevant context, act, check evidence, and revise the prompt using observed failures.</desc>
<rect width="1100" height="290" rx="18" fill="#101c2b"/>
<text x="40" y="49" fill="#f5f1e8" font-family="sans-serif" font-size="25">A prompt is a hypothesis. The result is evidence.</text>
<g fill="#20364b" stroke="#77c8b4" stroke-width="2"><rect x="40" y="90" width="220" height="90" rx="8"/><rect x="305" y="90" width="220" height="90" rx="8"/><rect x="570" y="90" width="220" height="90" rx="8"/><rect x="835" y="90" width="225" height="90" rx="8"/></g>
<g fill="#f5f1e8" font-family="sans-serif" font-size="20" text-anchor="middle"><text x="150" y="127">Define the outcome</text><text x="415" y="127">Select context</text><text x="680" y="127">Act and observe</text><text x="947" y="127">Check the result</text></g>
<g fill="#b4c8d8" font-family="sans-serif" font-size="15" text-anchor="middle"><text x="150" y="155">Acceptance examples</text><text x="415" y="155">Relevant files and sources</text><text x="680" y="155">Tools and artifacts</text><text x="947" y="155">Tests and source checks</text></g>
<g stroke="#77c8b4" stroke-width="3" fill="none"><path d="M265 135h30m-8-7 8 7-8 7M530 135h30m-8-7 8 7-8 7M795 135h30m-8-7 8 7-8 7"/><path d="M947 190v45H150v-45m-7 8 7-8 7 8"/></g><rect x="345" y="220" width="410" height="30" fill="#101c2b"/><text x="550" y="241" fill="#77c8b4" font-family="sans-serif" font-size="17" text-anchor="middle">Revise one thing using observed failures</text></svg>